name: Test and Lint
on:
  workflow_dispatch:
  pull_request:
    branches: [lean]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Test with pytest
        run: |        
          pytest tests/test_app2.py tests/conftest.py
  lint:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Get repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint with mypy
        run: |  
          mypy --python-executable project/ 
          enable_error_code = [import-not-found], ignore-without-code, unused-awaitable
      - name: Lint with black
      - name: Lint with black
        run: |
          black --diff --check project/
      - name: Lint with isort
        run: |
          isort --check-only --profile black project/
      - name: Lint with flake8
        run: |
          flake8 project/
        
          
